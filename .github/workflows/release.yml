name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Build Linux packages
        if: matrix.name == 'linux'
        run: npx electron-builder --linux AppImage deb --x64
      - name: Build Windows packages
        if: matrix.name == 'windows'
        run: npx electron-builder --win nsis portable --x64
      - name: Build macOS packages
        if: matrix.name == 'macos'
        run: npx electron-builder --mac zip dmg --x64 --arm64
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GemmaSearch-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
